
name: UnityHub Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml was not found at the repository root."
            echo "Ensure the Flutter app is committed to this repository."
            exit 1
          fi
          if [ ! -d android ]; then
            echo "::error::The android/ folder is missing."
            echo "Ensure the Flutter Android platform files are committed."
            exit 1
          fi
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityHub-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
